<section class="team" id="team">
  <div class="container">
    <div class="section-header">
      <div class="section-badge fade-in-up">
        <span>👥 Our Instructors</span>
      </div>
      <h2 class="section-title fade-in-up">
        Learn From
        <span class="gradient-text"> Industry Experts</span>
      </h2>
      <p class="section-description fade-in-up">
        Our instructors are seasoned AI professionals from top tech companies with years of 
        real-world experience in building and deploying AI solutions at scale.
      </p>
    </div>
    
    <div class="team-grid">
      <div class="team-card" *ngFor="let member of team">
        <div class="team-card-inner">
          <div class="member-image-wrapper">
            <img [src]="member.image" [alt]="member.name" class="member-image">
            <div class="image-overlay">
              <div class="social-links">
                <a [href]="member.social.linkedin" class="social-link" title="LinkedIn">
                  <span>in</span>
                </a>
                <a [href]="member.social.twitter" class="social-link" title="Twitter">
                  <span>𝕏</span>
                </a>
                <a [href]="member.social.github" class="social-link" title="GitHub">
                  <span>⚡</span>
                </a>
              </div>
            </div>
          </div>
          
          <div class="member-info">
            <h3 class="member-name">{{ member.name }}</h3>
            <p class="member-role">{{ member.role }}</p>
            <p class="member-bio">{{ member.bio }}</p>
            
            <div class="member-expertise">
              <span class="expertise-tag" *ngFor="let skill of member.expertise">
                {{ skill }}
              </span>
            </div>
            
            <div class="member-achievements">
              <div class="achievement" *ngFor="let achievement of member.achievements">
                <span class="achievement-icon">🏆</span>
                <span class="achievement-text">{{ achievement }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
