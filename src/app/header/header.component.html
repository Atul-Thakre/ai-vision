<header [class.scrolled]="isScrolled">
  <div class="container">
    <nav class="navbar">
      <div class="logo">
        <span class="gradient-text">AI Vision</span>
      </div>

      <ul class="nav-links" [class.active]="isMobileMenuOpen">
        <li><a (click)="scrollToSection('hero')">Home</a></li>
        <li><a (click)="scrollToSection('features')">Features</a></li>
        <li><a (click)="scrollToSection('curriculum')">Curriculum</a></li>
        <li><a (click)="scrollToSection('team')">Team</a></li>
        <li><a (click)="scrollToSection('pricing')">Pricing</a></li>
        <li><a (click)="scrollToSection('contact')">Contact</a></li>
      </ul>

      <div class="nav-actions">
        <button class="btn btn-secondary">Login</button>
        <button class="btn btn-primary">Get Started</button>
      </div>

      <div class="mobile-menu-toggle" (click)="toggleMobileMenu()">
        <span [class.active]="isMobileMenuOpen"></span>
        <span [class.active]="isMobileMenuOpen"></span>
        <span [class.active]="isMobileMenuOpen"></span>
      </div>
    </nav>
  </div>
</header>
